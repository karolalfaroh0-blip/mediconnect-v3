<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediConnect · App</title>
<style>
:root{
  --app:#F2F3F5; --card:#FFFFFF; --field:#F2F3F5; --dark:#0F1013; --dark2:#1C1D22;
  --line:#E5E7EB; --ink:#111214; --ink2:#6B6F78; --inv:#FFFFFF;
  --brand:#3B5BF6; --brand-soft:#E4E9FF;
  --ok:#1F9D57; --danger:#B42318; --ok-soft:#E3F5EA; --warn:#C27A12; --warn-soft:#FCF0DA; --star:#F5B301; --live:#E5484D;
  --r-card:28px; --r-tile:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{overflow:hidden;margin:0;font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#E6E8EC;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit;border:0;outline:0;background:none;width:100%;min-width:0}
.device{position:absolute;left:16px;top:16px;width:390px;height:844px;background:var(--app);border-radius:48px;overflow:hidden;isolation:isolate}

.device.dark{background:var(--dark)}
.status{background:linear-gradient(var(--app) 72%,rgba(242,243,245,0));position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:14px 30px 0 34px;z-index:40;font-weight:600;font-size:16px;pointer-events:none}
.status.light{color:#fff;background:none}
.status svg{display:block}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:58px 20px 132px;scrollbar-width:none;animation:in .32s cubic-bezier(.2,.8,.2,1)}
.screen::-webkit-scrollbar{display:none}
.screen.back{animation:inback .32s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inback{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.gap24{gap:24px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
/* type */
.hero-xl{font-size:40px;line-height:44px;letter-spacing:-1.4px;font-weight:400}
.hero{font-size:34px;line-height:40px;letter-spacing:-1.1px;font-weight:400}
.num{font-size:56px;line-height:58px;letter-spacing:-2.2px;font-weight:400}
.title{font-size:24px;line-height:30px;letter-spacing:-.6px;font-weight:400}
.ct{font-size:17px;line-height:22px;letter-spacing:-.3px;font-weight:500}
.body{font-size:15px;line-height:21px;letter-spacing:-.2px}
.bm{font-size:15px;line-height:21px;letter-spacing:-.2px;font-weight:500}
.label{font-size:13px;line-height:16px;font-weight:500}
.cap{font-size:12px;line-height:15px}
.micro{font-size:11px;line-height:13px;font-weight:600}
.mute{color:var(--ink2)}
.inv{color:#fff}
.dim{opacity:.62}
/* surfaces */
.card{background:var(--card);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:12px}
.card.p16{padding:16px}
.card.dark{background:var(--dark);color:#fff;position:relative;overflow:hidden}
.card.brand{background:var(--brand);color:#fff;position:relative;overflow:hidden}
.card.soft{background:var(--brand-soft)}
.card.warn{background:var(--warn-soft)}
.card.list{padding:8px;gap:0}
.tap{transition:transform .15s ease, background .15s ease}
.tap:active{transform:scale(.98)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.content{position:relative;z-index:1}
/* round buttons */
.cb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.cb.s40{width:40px;height:40px}.cb.s44{width:44px;height:44px}.cb.s36{width:36px;height:36px}.cb.s28{width:28px;height:28px}.cb.s52{width:52px;height:52px}.cb.s60{width:60px;height:60px}
.cb.fill{border:0;background:var(--card)}
.cb.field{border:0;background:var(--field)}
.cb.brand{border:0;background:var(--brand);color:#fff}
.cb.bsoft{border:0;background:var(--brand-soft);color:var(--brand)}
.cb.ok{border:0;background:var(--ok-soft);color:var(--ok)}
.cb.warn{border:0;background:var(--warn-soft);color:var(--warn)}
.cb.darkc{border:0;background:var(--dark);color:#fff}
.ico{display:block;flex:none}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;white-space:nowrap;font-size:13px;font-weight:500;flex:none}
.pill.h40{height:40px;padding:0 16px;font-size:15px;font-weight:500}
.pill.h44{height:44px;padding:0 18px;font-size:15px;font-weight:500}
.pill.h52{height:52px;padding:0 20px;font-size:15px;font-weight:500}
.pill.white{background:var(--card)}
.pill.fieldbg{background:var(--field)}
.pill.darkp{background:var(--dark);color:#fff}
.pill.brandp{background:var(--brand);color:#fff}
.pill.okp{background:var(--ok-soft);color:var(--ok)}
.pill.warnp{background:var(--warn-soft);color:var(--warn)}
.pill.bsoftp{background:var(--brand-soft);color:var(--brand)}
.pill.outline{border:1px solid var(--line)}
.pill.dash{border:1px dashed #C8CCD3}
.pill.sm{height:26px;padding:0 10px;font-size:11px;font-weight:600}
.badge{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
/* switch */
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .2s}
.sw.on{background:var(--brand)}.sw.on::after{left:21px}
/* fields */
.field{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:18px;background:var(--field)}
.search{display:flex;align-items:center;gap:10px;height:56px;padding:0 18px;border-radius:28px;background:var(--card)}
.sep{height:1px;background:var(--field)}
.li{display:flex;align-items:center;gap:12px;padding:12px}
/* nav */
.nav{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:40px;background:rgba(28,29,34,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 12px 32px -8px rgba(15,16,19,.35);z-index:30}
.nav button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.12);transition:background .2s,color .2s}
.nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* action bar */
.action{position:absolute;left:20px;right:20px;bottom:32px;height:60px;border-radius:16px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;padding:0 20px;z-index:30;box-shadow:0 12px 28px -12px rgba(59,91,246,.6);transition:transform .15s ease,background .2s}
.action:active{transform:scale(.985)}
.action .go{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .2s}
.action:active .go{transform:translateX(4px)}
.action .t{font-size:15px;font-weight:500;letter-spacing:-.2px;text-align:center}
.action .ch{opacity:.35;font-size:13px;letter-spacing:1px}
.action.off{background:#B9C5FC;box-shadow:none;pointer-events:none}

/* tiles */
.tile{border-radius:var(--r-tile);background:var(--card);padding:16px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.mini{border-radius:20px;background:var(--card);padding:14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
/* day / slot */
.day{flex:1;height:68px;border-radius:20px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day.on{background:var(--brand);color:#fff}
.day.on .cap{color:rgba(255,255,255,.75)}
.slot{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:500}
.slot.on{background:var(--dark);border-color:var(--dark);color:#fff}
.slot.off{background:var(--field);border-color:var(--field);color:var(--ink2);text-decoration:line-through;opacity:.7;pointer-events:none}
/* avatar */
.av{border-radius:50%;overflow:hidden;flex:none;display:block}
.av svg{display:block}
.people{display:flex;gap:14px}
.people .p{width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(15,16,19,.5);z-index:50;animation:fade .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--card);border-radius:32px 32px 0 0;padding:12px 20px 32px;z-index:51;display:flex;flex-direction:column;gap:20px;animation:up .32s cubic-bezier(.2,.8,.2,1);scrollbar-width:none;box-shadow:0 -8px 32px rgba(15,16,19,.14)}
.sheet::-webkit-scrollbar{display:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.inline-action{position:static;width:100%;margin-top:4px;box-shadow:none}
.card.dangerc{background:#F9E3DE}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center}
.cal .wd{font-size:12px;color:var(--ink2);height:24px;display:grid;place-items:center}
.cd{position:relative;height:42px;width:42px;margin:0 auto;border-radius:21px;display:grid;place-items:center;font-size:15px;font-weight:500;color:var(--ink)}
.cd.off{color:#C2C6CD;pointer-events:none}
.cd.full{color:#B4B8C0;text-decoration:line-through;pointer-events:none}
.cd.sug{background:var(--brand-soft);color:var(--brand)}
.cd.sug::after{content:'';position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--brand)}
.cd.on{background:var(--dark);color:#fff}
.cd.on::after{background:#fff}
.calnav{display:flex;align-items:center;gap:8px}
.calnav .cb.off{opacity:.35;pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px;vertical-align:-1px}
.slot.cur{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);pointer-events:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{pointer-events:none;position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:500;z-index:80;white-space:nowrap;animation:toast 2.4s ease forwards;box-shadow:0 12px 30px -10px rgba(15,16,19,.5)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
.radio{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.radio.on{background:var(--brand);border-color:var(--brand)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.opt{border:1.5px solid transparent}
.opt.on{border-color:var(--brand)}
.qr{width:96px;height:96px;flex:none}
.bars{display:flex;align-items:flex-end;gap:5px}
.bars i{display:block;width:10px;border-radius:5px;background:var(--brand-soft)}
.bars i.on{background:var(--brand)}
.step{display:flex;gap:14px;align-items:flex-start}
.conn{width:2px;height:22px;margin-left:17px;border-radius:1px;background:var(--line)}
.conn.on{background:var(--brand)}
.live{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:11px;font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.demo{border:1px dashed #C8CCD3;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.map{height:180px;border-radius:22px;overflow:hidden;position:relative;background:#E9ECF1}
.dots{display:flex;gap:6px}
.dots i{display:block;width:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.dots i.on{width:20px;background:#fff}
.stars{display:flex;gap:10px}
.stars button{flex:1;height:52px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--line);transition:background .15s,color .15s}
.stars button.on{background:var(--warn-soft);color:var(--star)}
.empty{padding:28px 12px;text-align:center}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--field)}
.res:first-child{border-top:0;padding-top:0}
.res .v{font-size:15px;font-weight:500;text-align:right}
.res .v.hi{color:var(--warn)}
.res .r{grid-column:1/-1;font-size:12px;color:var(--ink2)}
.docpick{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none;padding:8px 0;border-radius:20px;border:1.5px solid transparent}
.docpick.on{border-color:var(--brand);background:var(--brand-soft)}
.faq{padding:14px 0;border-top:1px solid var(--field)}
.faq:first-child{border-top:0;padding-top:0}
.danger{color:#C5362C}

/* ---------- stage + phone mockup ---------- */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:48px;padding:24px;background:radial-gradient(1100px 720px at 32% 18%,#FFFFFF 0%,#EEF0F4 48%,#DFE2E8 100%)}
.stage::before{content:"";position:absolute;width:620px;height:620px;left:50%;top:50%;transform:translate(-62%,-52%);background:radial-gradient(circle,rgba(59,91,246,.16),rgba(59,91,246,0) 65%);pointer-events:none}
.brandtag{position:absolute;left:28px;top:22px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#3A3E46;letter-spacing:-.1px}
.brandtag i{width:22px;height:22px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal}
.brandtag span{font-weight:400;color:var(--ink2)}
.phone-wrap{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:422px;height:876px;transform-origin:0 0}
.phone .rim{position:absolute;inset:0;border-radius:66px;background:linear-gradient(140deg,#E9EAED 0%,#A7ABB2 18%,#D9DBDF 34%,#8F939B 52%,#CFD2D7 70%,#9A9EA6 86%,#E3E5E8 100%);box-shadow:0 70px 120px -50px rgba(15,16,19,.55),0 30px 60px -30px rgba(15,16,19,.35),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 0 0 2px rgba(0,0,0,.08)}
.phone .bezel{position:absolute;inset:4px;border-radius:62px;background:#060607;box-shadow:inset 0 0 0 1.5px #1E1F23}
.phone .island{position:absolute;top:27px;left:50%;width:122px;height:36px;margin-left:-61px;border-radius:20px;background:#000;z-index:70;pointer-events:none}
.phone .island::after{content:"";position:absolute;right:16px;top:12px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2B3350,#0A0C12 70%)}
.phone .glare{position:absolute;left:16px;top:16px;width:390px;height:844px;border-radius:48px;pointer-events:none;z-index:65;background:linear-gradient(118deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 100%)}
.phone .hb{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#8C9098,#D7D9DD 45%,#8C9098)}
.phone .hb.l{left:-3px}.phone .hb.r{right:-3px}
/* presenter panel */
.panel{position:relative;flex:none;width:360px;max-height:calc(100vh - 48px);overflow:auto;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 24px 60px -30px rgba(15,16,19,.35),inset 0 0 0 1px rgba(17,18,20,.06);padding:18px;display:flex;flex-direction:column;gap:16px;font-size:13px;scrollbar-width:thin}
.panel h2{font-size:15px;font-weight:600;letter-spacing:-.2px;margin:0}
.panel h3{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.panel .tagsim{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#FCF0DA;color:#8A5300;font-size:11px;font-weight:600}
.panel .prog{height:6px;border-radius:3px;background:#E5E7EB;overflow:hidden}.panel .prog i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.case{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:14px;text-align:left;transition:background .15s}
.case:hover{background:#F2F3F5}.case.now{background:var(--brand-soft)}
.case b{flex:none;width:30px;height:24px;border-radius:8px;background:#EEF0F3;display:grid;place-items:center;font-size:11px;font-weight:700;color:#3A3E46}
.case.done b{background:var(--ok);color:#fff}
.case .ctx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.case .ctx span{color:var(--ink2);font-size:12px}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:#EEF0F3}
.seg button{flex:1;height:30px;border-radius:9px;font-size:12px;font-weight:500;color:#3A3E46;text-align:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,16,19,.12)}
.ctl{display:flex;flex-direction:column;gap:6px}.ctl>span{font-size:12px;color:#3A3E46}
.pbtn{height:36px;border-radius:12px;padding:0 12px;background:#fff;box-shadow:inset 0 0 0 1px #E5E7EB;font-size:12px;font-weight:500;text-align:center}
.pbtn.primary{background:var(--ink);color:#fff;box-shadow:none}
.log{font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0F1013;color:#C9D1E0;border-radius:14px;padding:10px 12px;max-height:150px;overflow:auto;white-space:pre-wrap}
.log em{color:#7FA0FF;font-style:normal}
.hoy{display:flex;align-items:center;gap:8px;font-size:12px;color:#3A3E46}.hoy input{width:auto;background:#fff;border-radius:8px;padding:4px 6px;box-shadow:inset 0 0 0 1px #E5E7EB;font-size:12px}
.pfab{position:fixed;right:20px;bottom:20px;z-index:90;height:44px;padding:0 16px;border-radius:22px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px;box-shadow:0 12px 30px -10px rgba(15,16,19,.5)}
.pscrim{position:fixed;inset:0;background:rgba(15,16,19,.35);z-index:94;display:none}
body.drawer .panel{background:#fff;position:fixed;right:12px;top:12px;bottom:12px;max-height:none;z-index:95;display:flex;animation:up .25s ease}
body.drawer.open .pscrim{display:block}
body.drawer:not(.open) .panel{display:none}
body.drawer .pfab{display:inline-flex}
body.nopanel .panel,body.nopanel .pfab{display:none!important}
/* real phones: full screen, no fake status bar, safe areas (H18) */
body.native .stage{display:block;padding:0;background:var(--app)}
body.native .stage::before,body.native .brandtag{display:none}
body.native .phone-wrap{width:100vw!important;height:100dvh!important}
body.native .phone{width:100vw;height:100dvh;transform:none!important}
body.native .rim,body.native .bezel,body.native .island,body.native .glare,body.native .hb{display:none}
body.native .device{left:0;top:0;width:100vw;height:100dvh;border-radius:0}
body.native .status{display:none}
body.native .screen{padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 132px)}
body.native .nav{bottom:calc(env(safe-area-inset-bottom) + 18px)}
body.native .action:not(.inline-action){bottom:calc(env(safe-area-inset-bottom) + 20px)}
/* accessibility (H16) */
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>

V.pago = () => { const d = D(S.doc); const ins = S.myIns.find(i => i.id===S.payIns); const when = dShort(pickDate())+' '+MES[pickDate().getMonth()]+' · '+pickHour();
  const mode = !ins ? 'none' : !ins.valid ? 'expired' : !accepts(d,ins.id) ? 'notaccepted' : 'none';
  const insN = ins ? insBy(ins.id).n.split(' ')[0] : '';
  const she = d.n.startsWith('Dra.');
  let body = '';
  if(mode==='expired') body = notice('warn','shield','Tu póliza '+insN+' '+ins.pol+' está vencida','No podemos usarla para esta cita. No se hizo ningún cobro y tu cita sigue apartada. Podés elegir otro seguro o pagar sin seguro.')+btn2('Elegir otro seguro','sheet','elegirSeguro')+docRow(d,when)+payMethods();
  else if(mode==='notaccepted') body = notice('warn','shield',DrName(d)+' no acepta '+insN,'Tu póliza '+insN+' está vigente, pero '+(she?'esta médica':'este médico')+' no trabaja con '+insN+'. No se hizo ningún cobro y tu cita sigue apartada. Podés elegir otro seguro o pagar sin seguro.')+docRow(d,when)+
    '<div class="stack" style="gap:4px"><span class="ct">Otras opciones</span><span class="cap mute">'+(she?'Esta médica':'Este médico')+' acepta '+d.nets.filter(n => accepts(d,n)).map(n => insBy(n).n.split(' ')[0]).join(', ').replace(/, ([^,]*)$/,' y $1')+'</span></div>'+btn2('Elegir otro seguro','sheet','elegirSeguro');
  else body = docRow(d,when)+payMethods();
  const title = mode==='expired' ? 'No pudimos<br>validar tu seguro' : mode==='notaccepted' ? 'Tu seguro no aplica<br>con '+(she?'esta médica':'este médico') : 'Pagá tu<br>consulta';
  const label = mode==='notaccepted' ? 'Pagar sin seguro · $'+d.price+'.00' : S.payMethod===2 ? 'Apartar cita · pago en clínica' : (mode==='expired'?'Pagar sin seguro · $':'Pagar $')+d.price+'.00';

const dev = $('#dev');
function render(anim){
  const fn = V[S.scr]; const v = fn();
  const prevScroll = !anim && dev.querySelector('.screen') ? dev.querySelector('.screen').scrollTop : 0;
  const prevSheetScroll = !anim && dev.querySelector('.sheet') ? dev.querySelector('.sheet').scrollTop : 0;
  const focus = document.activeElement && document.activeElement.id ? { id: document.activeElement.id, pos: document.activeElement.selectionStart } : null;
  dev.classList.toggle('dark', !!v.dark);
  let html = statusBar(v.dark) + v.html + (v.nav && !v.html.includes('<button class="action"') ? nav(v.nav) : '');
  if(S.sheet) html += '<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog">'+SH[S.sheet]()+'</div>';
  dev.innerHTML = html;
  const sc = dev.querySelector('.screen');
  if(sc){ if(!anim){ sc.style.animation='none'; sc.scrollTop = prevScroll; } else if(S.back) sc.classList.add('back'); }
  const sh = dev.querySelector('.sheet'); if(sh && sheetOpen===S.sheet){ sh.style.animation='none'; dev.querySelector('.scrim').style.animation='none'; sh.scrollTop = prevSheetScroll; }
  sheetOpen = S.sheet;
  if(focus){ const el = document.getElementById(focus.id); if(el){ el.focus(); try{ el.setSelectionRange(focus.pos, focus.pos); }catch(e){} } }
  if(anim && S.scr==='editar' && S.editFocus){ const f=S.editFocus; S.editFocus=null; setTimeout(() => { const sec = f==='emergencia' ? document.getElementById('sec-emergencia') : document.getElementById('ed-'+f); if(sec){ sec.scrollIntoView({block:'center'}); if(sec.tagName==='INPUT') sec.focus(); } }, 60); }
  if(S.toast){ const t=document.createElement('div'); t.className='toast'; t.style.animationDelay='-'+Math.min(2.3,(Date.now()-toastAt)/1000)+'s'; t.textContent=S.toast; dev.appendChild(t); }
  schedule();
  trackCases();
  renderPanel();
}
let sheetOpen = null;
function renderToast(){ dev.querySelectorAll('.toast').forEach(x => x.remove()); if(!S.toast) return; const t = document.createElement('div'); t.className='toast'; t.textContent=S.toast; dev.appendChild(t); const me=S.toast; clearTimeout(toastTimer); toastTimer=setTimeout(() => { if(S.toast===me){ S.toast=null; dev.querySelectorAll('.toast').forEach(x => x.remove()); } }, 2400); }
let toastTimer=null;

function schedule(){
  if(S.scr==='sala' && S.turn>0 && !timers.length) timers.push(setTimeout(() => { timers=[]; S.turn--; log('fila.avanzar() → antes: '+S.turn); if(S.turn===0 && S.notify) setToast('Te toca: pasá al '+D(S.booked.doc).room.split(' · ')[0]); render(false); }, AVANCE_MS/2));
  if(S.scr==='consulta' && S.cstage==='live' && !timers.length) timers.push(setTimeout(() => { timers=[]; decideConsult(); }, AVANCE_MS));
  if(S.scr==='sala' && S.turn<=0 && !timers.length) timers.push(setTimeout(() => { timers=[]; act('enter'); }, 2200));
  if(S.scr==='lab' && S.labStep>=3 && !timers.length) timers.push(setTimeout(() => { timers=[]; act('labDone'); }, 2000));
  if(S.scr==='lab' && S.labStep<3 && !timers.length) timers.push(setTimeout(() => { timers=[]; S.labStep++; log('laboratorio.paso = '+S.labStep); if(S.labStep===3) setToast('Tu resultado ya está en tu expediente'); render(false); }, AVANCE_MS/3));
}

  c1(){ setupBase(); S.demo.full=true; S.day=2; S.slot=null; S.hist=['inicio','citas']; S.scr='medico'; log('C1 · ¿Hay horarios ese día? NO → error día sin cupos'); },
  c2(){ setupBase(); S.scr='confirmada'; log('C2 · cita AGENDADA con pase QR'); },
  c3(){ setupBase(); S.hist=['inicio','citas','medico']; S.scr='confirmar'; log('C3 · SISA vigente + médico acepta → $0'); },
  c4(){ setupBase(); S.demo.ins='vencido'; S.payIns='mapfre'; S.hist=['inicio','citas','medico']; S.scr='confirmar'; S.sheet='elegirSeguro'; log('C4 · póliza MAPFRE vencida → pago directo'); },
  c4b(){ setupBase(); S.doc='men'; S.slot=4; S.payIns='sisa'; S.hist=['inicio','citas','medico','confirmar']; S.scr='pago'; log('C4b · Méndez no acepta SISA → pago directo $30'); },
  c4c(){ setupBase(); S.payIns=null; S.hist=['inicio','citas','medico','confirmar','pago']; S.scr='rechazado'; log('C4c · pago.cobrar() → RECHAZADO'); },
  c5(){ setupBase(); if(!S.sym.size) SAMPLE(); S.hist=['confirmada']; S.scr='sala'; log('C5 · cita EN_SALA · turno A-07'); },
  c5b(){ setupBase(); if(!S.sym.size) SAMPLE(); S.paid=true; S.demo.lab=false; S.hist=[]; S.scr='consulta'; log('C5b · consulta con pago directo $35'); },
  c5c(){ setupBase(); S.sym=new Set(); S.demo.lab=false; S.hist=[]; S.scr='consulta'; log('C5c · sin síntomas → control general'); },
  c6(){ setupBase(); if(!S.sym.size) SAMPLE(); S.demo.lab=true; S.hist=[]; S.scr='consulta'; log('C6 · médico.ordenaExamenes = SÍ'); },
  c7(){ setupBase(); S.paid=true; S.didLab=true; S.booked=null; S.visitDone=true; S.hist=[]; S.scr='resumen'; log('C7 · cita ATENDIDA · resumen'); },
  c8(){ setupBase(); S.didLab=true; S.booked=null; S.visitDone=true; S.hist=[]; S.scr='resumen'; log('C8 · control sugerido = cita + 7 días'); }
};
const PANEL=document.getElementById('panel');
function seg(key, opts){ return '<div class="seg" role="group">'+opts.map(o => '<button data-p="set" data-k="'+key+'" data-v="'+o[0]+'" class="'+(String(S.demo[key])===String(o[0])?'on':'')+'" aria-pressed="'+(String(S.demo[key])===String(o[0]))+'">'+o[1]+'</button>').join('')+'</div>'; }
function renderPanel(){
  if(!PANEL) return;
  const done=new Set(S.covered); const n=['C1','C2','C3','C4','C5','C6','C7','C8'].filter(c=>done.has(c)).length;
  const hoyStr=DLONG[HOY.getDay()].toLowerCase()+' '+HOY.getDate()+' '+MES[HOY.getMonth()]+' '+HOY.getFullYear();
  const iso=HOY.getFullYear()+'-'+String(HOY.getMonth()+1).padStart(2,'0')+'-'+String(HOY.getDate()).padStart(2,'0');
  const adv = S.scr==='sala'?'Avanzar la fila':S.scr==='lab'?'Avanzar el laboratorio':S.scr==='consulta'&&S.cstage==='live'?'Decidir ahora':null;
  PANEL.innerHTML=
   '<div class="row" style="gap:8px"><h2 class="grow">Panel del presentador</h2><span class="tagsim">Simulado</span></div>'+
   '<div class="cap mute" style="margin-top:-8px">Fuera de la app del paciente. Acá decide el médico y se simulan pagos y seguros.</div>'+
   '<div><h3>Casos del curso · '+n+' de 8</h3><div class="prog"><i style="width:'+(n/8*100)+'%"></i></div></div>'+
   '<div class="stack" style="gap:2px"><button class="case" data-p="jump" data-v="flow"><b>▶</b><span class="ctx"><strong>Flujo completo</strong><span>Desde Bienvenida, camino principal</span></span></button>'+
   CASES.map(c => '<button class="case'+(done.has(c[0])?' done':'')+'" data-p="jump" data-v="'+c[3]+'"><b>'+(done.has(c[0])?'✓':c[0])+'</b><span class="ctx"><strong>'+c[0]+' · '+c[1]+'</strong><span>'+c[2]+'</span></span></button>').join('')+'</div>'+
   '<div class="stack" style="gap:12px"><h3 style="margin:0">Decisiones y simulación</h3>'+
   '<div class="ctl"><span>El médico pide exámenes</span>'+seg('lab',[[true,'Sí · C6'],[false,'No · C7']])+'</div>'+
   '<div class="ctl"><span>Próximo pago con tarjeta</span>'+seg('pay',[['ok','Aprobado'],['fail','Rechazado']])+'</div>'+
   '<div class="ctl"><span>Seguro de la próxima cita</span>'+seg('ins',[['vigente','Vigente'],['vencido','Vencido'],['noacepta','No aceptado']])+'</div>'+
   '<div class="ctl"><span>Día sin cupos ('+DAYN[days[2][0]].toLowerCase()+' '+days[2][1]+')</span>'+seg('full',[[true,'Activado'],[false,'Desactivado']])+'</div>'+
   '<div class="row" style="gap:6px;flex-wrap:wrap"><button class="pbtn" data-p="sym">'+(S.sym.size?'Vaciar síntomas':'Cargar síntomas de ejemplo')+'</button>'+(adv?'<button class="pbtn primary" data-p="adv">'+adv+'</button>':'')+'<button class="pbtn" data-p="reset">Reiniciar demo</button></div>'+
   '<label class="hoy">Hoy: <strong>'+hoyStr+'</strong><input type="date" value="'+iso+'" data-p="hoy" aria-label="Cambiar la fecha de hoy"></label></div>'+
   '<div><h3>Registro</h3><div class="log" id="plog">'+(S.logs.length?S.logs.slice(-14).join('\n'):'<em>—</em> Elegí un caso o tocá la app.')+'</div></div>';
  const L=document.getElementById('plog'); if(L) L.scrollTop=L.scrollHeight;
}
PANEL && PANEL.addEventListener('click', (e) => {
  const t=e.target.closest('[data-p]'); if(!t) return; const a=t.dataset.p, v=t.dataset.v;
  if(a==='jump'){ JUMP[v](); document.body.classList.remove('open'); render(true); return; }
  if(a==='set'){ const k=t.dataset.k; S.demo[k] = v==='true'?true:v==='false'?false:v; log('demo.'+k+' = '+v); if(k==='full' && S.scr==='medico'){ if(!S.demo.full && S.slot==null) S.slot=firstFree(S.day); } render(false); return; }
  if(a==='sym'){ if(S.sym.size){ S.sym=new Set(); log('síntomas = []'); } else { SAMPLE(); log('síntomas = [Fiebre, Dolor de garganta] · 2–3 días'); } render(false); return; }
  if(a==='adv'){ if(S.scr==='sala'){ clearTimers(); if(S.turn>0){ S.turn--; log('fila.avanzar() → antes: '+S.turn); } else act('enter'); render(false); } else if(S.scr==='lab'){ clearTimers(); if(S.labStep<3){ S.labStep++; log('laboratorio.paso = '+S.labStep); render(false); } else act('labDone'); } else decideConsult(); return; }
  if(a==='reset'){ const q=new URLSearchParams(location.search); location.search=q.toString(); return; }
});
PANEL && PANEL.addEventListener('change', (e) => { const t=e.target; if(t.dataset.p==='hoy' && t.value){ const q=new URLSearchParams(location.search); q.set('hoy',t.value); location.search=q.toString(); } });
document.getElementById('pfab').addEventListener('click',()=>document.body.classList.toggle('open'));
document.getElementById('pscrim').addEventListener('click',()=>document.body.classList.remove('open'));
render(true);
function fit(){
  const B=document.body, demo=QS.get('demo');
  const native = innerWidth<=480 || (matchMedia('(pointer:coarse)').matches && Math.min(innerWidth,innerHeight)<=480);
  B.classList.toggle('native', native);
  B.classList.toggle('nopanel', demo==='0' || (native && demo!=='1'));
  const docked = !native && demo!=='0' && innerWidth>=1100;
  B.classList.toggle('drawer', !docked && !B.classList.contains('nopanel'));
  const wrap=document.getElementById('phoneWrap'), ph=document.getElementById('phone');
  if(native){ ph.style.transform=''; return; }
  const availW = innerWidth - 48 - (docked ? 360+48 : 0), availH = innerHeight - 64;
  const s = Math.min(1.15, availH/876, availW/422);
  ph.style.transform='scale('+s+')'; wrap.style.width=(422*s)+'px'; wrap.style.height=(876*s)+'px';
}
addEventListener('resize',fit); fit();
})();
</script>
</body>
</html>
